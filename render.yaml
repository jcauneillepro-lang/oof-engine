services:
  - type: web
    name: oof-engine
    env: python
    region: frankfurt
    plan: starter
    buildCommand: |
      apt-get update && apt-get install -y poppler-utils libpango-1.0-0 libpangoft2-1.0-0
      pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
